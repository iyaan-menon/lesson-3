<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ordered List</h1>
    <ol>
    <li>Cricket</li>
    <li>Football</li>
    <li>Basketball</li>
    <li>Swimming</li>
    </ol>

    <h1>Unordered List</h1>
    <ul>
        <li>Green</li>
        <li>Yellow</li>
        <li>Blue</li>
        <li>Red</li>
    </ul>

    <h1>Description List</h1>
    <dl>
        <dt>Hot drinks:</dt>
        <dd>Tea,Coffee</dd>

        <dt>Fizzy drinks:</dt>
        <dd>Cola,Fanta</dd>

    </dl>
</body>
</html>
